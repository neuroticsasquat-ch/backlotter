version: '3'

# Postgres and Traefik are the shared stack in the tbc-localdev-infra repo
# (~/projects/tbc-localdev-infra); `task infra:up` starts it and creates the external
# `proxy` network. Optional, so a checkout without it (CI) still runs every task that
# doesn't need it.
includes:
  infra:
    taskfile: ~/projects/tbc-localdev-infra/Taskfile.yml
    dir: ~/projects/tbc-localdev-infra
    optional: true

vars:
  COMPOSE: "docker compose"
  SVC: "upmovies-backend"
  EXEC: "{{.COMPOSE}} exec {{.SVC}}"
  # The frontend (frontend/) runs in its own container; the fe:* tasks below are its.
  FE_SVC: "upmovies-frontend"
  FE_EXEC: "{{.COMPOSE}} exec {{.FE_SVC}}"
  # The NEU-2286 throughput bench, its own compose project (docker-compose.bench.yml).
  BENCH: "{{.COMPOSE}} -f docker-compose.bench.yml"

tasks:
  up:
    desc: Start the shared infra, then the backend and frontend containers
    cmds:
      - task: infra:up
      - "{{.COMPOSE}} up -d"
  down:
    desc: Stop both containers (leaves the shared infra running)
    cmds:
      - "{{.COMPOSE}} down"
  restart:
    desc: Restart the backend container
    cmds:
      - "{{.COMPOSE}} restart {{.SVC}}"
  # The frontend's named node_modules volume is filled from the image only when it is
  # first created, so a rebuilt image alone never reaches the running container. The
  # throwaway install writes the lockfile's packages into the volume. CI=true: when the
  # volume's layout differs from the image's, pnpm asks before reinstalling node_modules,
  # and with no TTY (an agent, a script) that prompt waits forever.
  build:
    desc: Rebuild both images (uv.lock, pnpm-lock.yaml), sync the frontend's node_modules volume, recreate the containers
    cmds:
      - "{{.COMPOSE}} build"
      - "{{.COMPOSE}} run --rm --no-deps -e CI=true {{.FE_SVC}} pnpm install --frozen-lockfile"
      - "{{.COMPOSE}} up -d"
  # `--no-sync` on all three: the image is where dependencies get installed, and an
  # exact sync to the base dependencies would strip pytest, ruff, pyright and uv itself
  # out of the running container. The change lands with `task build`.
  deps:add:
    desc: 'Add a dependency (task deps:add -- <pkg>), then `task build`'
    cmds:
      - "{{.EXEC}} uv add --no-sync {{.CLI_ARGS}}"
  deps:add-dev:
    desc: 'Add a dev-group dependency (task deps:add-dev -- <pkg>), then `task build`'
    cmds:
      - "{{.EXEC}} uv add --no-sync --dev {{.CLI_ARGS}}"
  deps:remove:
    desc: 'Remove a dependency (task deps:remove -- <pkg>; add `--dev` for a dev one), then `task build`'
    cmds:
      - "{{.EXEC}} uv remove --no-sync {{.CLI_ARGS}}"
  deps:lock:
    desc: Re-resolve uv.lock after a pyproject.toml change (then `task build`)
    # A throwaway container with the repo mounted, so the lockfile lands on the host
    # whether or not the backend service is running. trixie, not bookworm: astral stopped
    # publishing the bookworm tags at uv 0.9.30, whose older lockfile revision rewrote
    # Dependabot's (NEU-2236). `--pull always`, so a cached image can't go stale the same way.
    cmds:
      - docker run --rm --pull always -v "$PWD":/app -w /app ghcr.io/astral-sh/uv:python3.13-trixie-slim uv lock {{.CLI_ARGS}}
  logs:
    desc: Follow backend logs
    cmds:
      - "{{.COMPOSE}} logs -f {{.SVC}}"
  shell:
    desc: Open a bash shell inside the backend container
    cmds:
      - "{{.EXEC}} bash"
  ps:
    desc: Show compose service status
    cmds:
      - "{{.COMPOSE}} ps"
  db:init:
    desc: Create the upmovies and upmovies_test databases in the shared Postgres (idempotent)
    cmds:
      - |
        for db in upmovies upmovies_test; do
          docker exec tbc_postgresql_db psql -U root -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 \
            || docker exec tbc_postgresql_db psql -U root -d postgres -c "CREATE DATABASE $db"
        done
  db:refresh:
    desc: 'Refresh local catalog/news/ingest from prod (local app + user data preserved)'
    cmds:
      - 'scripts/refresh_db.sh content'
  db:refresh:app:
    desc: 'Refresh local app schema from prod — DROPS local users (prompts first)'
    cmds:
      - 'scripts/refresh_db.sh app'
  db:refresh:all:
    desc: 'Refresh every schema from prod — DROPS local users (prompts first)'
    cmds:
      - 'scripts/refresh_db.sh both'
  migrate:
    desc: Run alembic migrations against the upmovies database
    cmds:
      - "{{.EXEC}} alembic upgrade head"
  makemigration:
    desc: 'Create a new autogenerated migration (task makemigration -- "message")'
    cmds:
      - "{{.EXEC}} alembic revision --autogenerate -m \"{{.CLI_ARGS}}\""
  test:
    desc: Run the pytest suite inside the container
    cmds:
      - "{{.EXEC}} pytest {{.CLI_ARGS}}"
  test:unit:
    desc: Run only the unit tests
    cmds:
      - "{{.EXEC}} pytest tests/unit {{.CLI_ARGS}}"
  test:integration:
    desc: Run only the integration tests
    cmds:
      - "{{.EXEC}} pytest tests/integration {{.CLI_ARGS}}"
  # No paths: what ruff and pyright check is set in pyproject.toml, so these and CI's
  # shared python.yml (which runs them bare) can't disagree.
  lint:
    desc: 'Run ruff check (task lint [-- --fix])'
    cmds:
      - "{{.EXEC}} ruff check {{.CLI_ARGS}}"
  format:
    desc: Run ruff format
    cmds:
      - "{{.EXEC}} ruff format {{.CLI_ARGS}}"
  format:check:
    desc: 'Check ruff formatting without writing (task format:check [-- <paths>])'
    cmds:
      - "{{.EXEC}} ruff format --check {{.CLI_ARGS}}"
  typecheck:
    desc: Run pyright static type check
    cmds:
      - "{{.EXEC}} pyright {{.CLI_ARGS}}"
  coverage:
    desc: 'Run pytest with coverage (HTML report in ./htmlcov)'
    cmds:
      - "{{.EXEC}} pytest --cov=src/upmovies --cov-report=term-missing --cov-report=html {{.CLI_ARGS}}"

  # Frontend (frontend/), in the upmovies-frontend container (NEU-2236). The lint,
  # typecheck, test and build tasks run the package scripts CI's js job runs.
  fe:install:
    desc: Reinstall the frontend's dependencies from pnpm-lock.yaml into the running container
    cmds:
      - "{{.FE_EXEC}} pnpm install --frozen-lockfile"
  fe:restart:
    desc: Restart the frontend container
    cmds:
      - "{{.COMPOSE}} restart {{.FE_SVC}}"
  fe:logs:
    desc: Follow frontend logs
    cmds:
      - "{{.COMPOSE}} logs -f {{.FE_SVC}}"
  fe:shell:
    desc: Open a bash shell inside the frontend container
    cmds:
      - "{{.FE_EXEC}} bash"
  fe:lint:
    desc: Run oxlint on the frontend (fails on warnings)
    cmds:
      - "{{.FE_EXEC}} pnpm run lint"
  fe:format:
    desc: Run prettier --write on the frontend
    cmds:
      - "{{.FE_EXEC}} pnpm run format"
  # The pre-commit hook passes repo-relative paths (frontend/src/...); the container
  # works in frontend/, so the prefix is stripped.
  fe:format:check:
    desc: 'Run prettier --check (task fe:format:check [-- <files>] to check only those)'
    cmds:
      - "{{.FE_EXEC}} pnpm exec prettier --check {{if .CLI_ARGS}}{{.CLI_ARGS | replace \"frontend/\" \"\"}}{{else}}\"src/**/*.{ts,tsx,css,json}\"{{end}}"
  fe:typecheck:
    desc: Type-check the frontend (react-router typegen, then tsc -b)
    cmds:
      - "{{.FE_EXEC}} pnpm run typecheck"
  fe:test:
    desc: 'Run the frontend test suite once (task fe:test [-- src/path/to/file.test.tsx])'
    cmds:
      - "{{.FE_EXEC}} pnpm run test {{.CLI_ARGS}}"
  fe:test:watch:
    desc: Run the frontend tests in watch mode
    cmds:
      - "{{.FE_EXEC}} pnpm run test:watch {{.CLI_ARGS}}"
  fe:cf-typegen:
    desc: Regenerate the Cloudflare Worker types (Env, worker-configuration.d.ts)
    cmds:
      - "{{.FE_EXEC}} pnpm exec wrangler types"
  # Exception (CONVENTIONS.md names this `build:app`): `fe:build` is the name the monorepo
  # spec (ops, Decision 8) gives it. The rule exists so the bundle can't be confused with
  # `build`, the image rebuild, and the fe: prefix already keeps them apart.
  fe:build:
    desc: Build the frontend for production (react-router build, what Workers Builds runs)
    cmds:
      - "{{.FE_EXEC}} pnpm run build"
  fe:deploy-dry-run:
    desc: Build, then dry-run the Worker deploy (bundles the SSR Worker and lists the assets, uploads nothing)
    cmds:
      - "{{.FE_EXEC}} pnpm run build"
      - "{{.FE_EXEC}} pnpm exec wrangler deploy --dry-run"
  # Workers Builds deploys every push to main that touches frontend/; this is the manual
  # escape hatch it replaces, kept from the frontend's own Taskfile. It ships whatever the
  # last `fe:build` left in the build output.
  fe:deploy:
    desc: Deploy the last fe:build to Cloudflare (Workers Builds normally does this)
    cmds:
      - "{{.FE_EXEC}} pnpm exec wrangler deploy"
  fe:deps:add:
    desc: 'Add a frontend runtime dependency (task fe:deps:add -- <package>)'
    cmds:
      - "{{.FE_EXEC}} pnpm add {{.CLI_ARGS}}"
  fe:deps:add-dev:
    desc: 'Add a frontend dev dependency (task fe:deps:add-dev -- <package>)'
    cmds:
      - "{{.FE_EXEC}} pnpm add -D {{.CLI_ARGS}}"
  fe:deps:remove:
    desc: 'Remove a frontend dependency (task fe:deps:remove -- <package>)'
    cmds:
      - "{{.FE_EXEC}} pnpm remove {{.CLI_ARGS}}"

  release-notes:
    desc: 'Prepend a tag''s notes to RELEASE_NOTES.md (task release-notes -- v0.4.1)'
    silent: true
    # Runs on the HOST, deliberately breaking this file's otherwise universal
    # "everything goes through the container" rule: git-cliff reads git history and
    # tags, and neither the binary nor a usable .git lives in the image.
    cmds:
      - |
        set -eu
        tag="{{.CLI_ARGS}}"
        if [ -z "$tag" ]; then
          echo "usage: task release-notes -- vX.Y.Z" >&2
          exit 1
        fi
        # Tags first, always. git-cliff renders a tag it cannot see as "## Unreleased"
        # rather than failing, and that heading then sticks in the committed file.
        git fetch --tags --force --quiet
        if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "no such tag: $tag — tag the release before writing its notes" >&2
          exit 1
        fi
        version="${tag#v}"
        # Anchored: the folded "Frontend release history" has "### <version> — " headings.
        if grep -q "^## $version — " RELEASE_NOTES.md 2>/dev/null; then
          echo "RELEASE_NOTES.md already has a section for $version; nothing to do" >&2
          exit 0
        fi
        prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
        if [ -n "$prev" ]; then range="$prev..$tag"; else range="$tag"; fi
        section="$(git-cliff --config cliff.toml --strip all "$range")"
        if [ -z "$section" ]; then
          echo "git-cliff produced nothing for $range (no user-facing commits?)" >&2
          exit 1
        fi
        # Prepend, never rebuild: RELEASE_NOTES.md is an accumulation of per-release
        # chunks, and older sections were written against older cliff.toml settings.
        tmp="$(mktemp)"
        {
          echo "# Release notes"
          echo
          echo "$section"
          echo
          tail -n +2 RELEASE_NOTES.md | sed '/./,$!d'
        } > "$tmp"
        mv "$tmp" RELEASE_NOTES.md
        echo "Prepended $version to RELEASE_NOTES.md"

  # The throughput bench (NEU-2286): the prod image in its own compose project
  # (docker-compose.bench.yml), loaded from the dev container over the proxy network. Results
  # and profiles go to bench-out/ (gitignored). Vary the stack with environment variables on
  # bench:up: BENCH_OTEL=0 (no opentelemetry-instrument), BENCH_SENTRY_DSN= (no Sentry),
  # MAX_IN_FLIGHT_REQUESTS=<n>, OTEL_PYTHON_DISABLED_INSTRUMENTATIONS=<list>.
  bench:up:
    desc: 'Build and (re)start the bench stack, waiting until bench-api is healthy'
    cmds:
      - "{{.BENCH}} up -d --build --wait"
  bench:down:
    desc: Stop the bench stack
    cmds:
      - "{{.BENCH}} down"
  # CPU in cores for bench-api, Postgres and the load generator, and Docker's health-status
  # changes during the run: see scripts/bench_load.sh.
  bench:load:
    desc: 'Run scripts/bench_public_burst.py at bench-api, with CPU and health changes (task bench:load -- <args>)'
    cmds:
      - scripts/bench_load.sh {{.CLI_ARGS}}
  # A py-spy profile of bench-api's uvicorn process, then its breakdown by component.
  # `task bench:profile -- 60` for the event loop; `task bench:profile -- 60 --gil` for the
  # GIL-holding thread. Start the load first, in another shell. `--no-deps`, or compose
  # re-evaluates bench-api against this shell's environment and may recreate it mid-run.
  bench:profile:
    desc: 'Profile bench-api with py-spy for N seconds and break it down (task bench:profile -- <seconds> [--gil])'
    cmds:
      - |
        out=profile-$(date +%Y%m%dT%H%M%S).txt
        {{.BENCH}} run --rm --no-deps bench-pyspy py-spy record --pid 1 --rate 100 --nonblocking --threads --full-filenames \
          --format raw -o "/out/$out" --duration {{.CLI_ARGS}}
        case "{{.CLI_ARGS}}" in *--gil*) by=--by-thread ;; *) by= ;; esac
        {{.EXEC}} python scripts/bench_profile_breakdown.py $by "bench-out/$out"
  bench:cpu:
    desc: 'Run the single-core CPU benchmark in bench-api (compare with prod for the scale factor)'
    cmds:
      - "{{.BENCH}} exec bench-api python - < scripts/bench_cpu.py"
